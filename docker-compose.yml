version: "3.8"

services:
  zuzol-badanie:
    build:
      context: .
      dockerfile: Dockerfile
    image: zuzol-badanie:latest
    container_name: zuzol-badanie
    restart: unless-stopped
    ports:
      - "67:8080"
    volumes:
      # Persist CSV results and generated Excel outside the container
      - zuzol-data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
      - DATA_DIR=/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

volumes:
  zuzol-data:
    driver: local
